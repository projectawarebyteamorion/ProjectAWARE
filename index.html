<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Weather Reports</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    html, body, #map { height: 100%; margin: 0; }
    .pop img { width: 100%; margin-top: 6px; border-radius: 4px; }
    #note { position: absolute; z-index: 1000; top: 10px; left: 50px; background: #fff;
            padding: 6px 10px; border-radius: 4px; font: 14px sans-serif; }
  </style>
</head>
<body>
<div id="map"></div>
<div id="note">Loading reports...</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
var API = 'https://script.google.com/macros/s/AKfycbzBWh-Y9oTxKlbYC4_p2mNv2arps8jiTcNMpSYPaM3PYvh-Doq5GOznIFn_6Kc3QMO3/exec';

var note = document.getElementById('note');
var map = L.map('map').setView([39.5, -98.35], 4);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© OpenStreetMap contributors'
}).addTo(map);

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

if (API.indexOf('PASTE_') === 0) {
  note.textContent = 'The web app URL has not been added to this file yet.';
} else {
  fetch(API)
    .then(function (r) { return r.json(); })
    .then(function (reports) {
      note.textContent = reports.length + ' report(s) loaded';
      var points = [];
      reports.forEach(function (r) {
        var rain  = r['Rainfall Amount (in inches)'];
        var snow  = r['Snowfall amount (in inches or feet)'];
        var hail  = r['Hailstone size (in inches)'];
        var other = r['Any other precipitation types'];
        var wind  = r['Wind speed and direction (in mph or knots)'];

        var html = '<div class="pop"><b>' + esc(r['Is this a weather report or a morningly check in?']) + '</b>';
        html += '<br>' + esc(r['Current date']) + ' ' + esc(r['Current time']);
        html += '<br><i>' + esc(r['Please State the Location of this Event.']) + '</i>';
        if (r['Please decribe the current situation.']) html += '<p>' + esc(r['Please decribe the current situation.']) + '</p>';
        html += '<table style="width:100%;border-collapse:collapse;margin-top:6px">';
        html += '<tr><td>Rainfall</td><td><b>' + (rain ? esc(rain) + ' in' : 'None') + '</b></td></tr>';
        html += '<tr><td>Snowfall</td><td><b>' + (snow ? esc(snow) : 'None') + '</b></td></tr>';
        html += '<tr><td>Hail size</td><td><b>' + (hail ? esc(hail) + ' in' : 'None') + '</b></td></tr>';
        html += '<tr><td>Wind</td><td><b>' + (wind ? esc(wind) : 'None') + '</b></td></tr>';
        html += '<tr><td>Other</td><td><b>' + (other ? esc(other) : 'None') + '</b></td></tr>';
        html += '</table>';
        String(r.PhotoURLs || '').split(',').filter(Boolean).forEach(function (u) {
          html += '<img src="' + esc(u) + '">';
        });
        html += '</div>';

        var bits = [];
        if (rain) bits.push('Rain ' + esc(rain) + ' in');
        if (snow) bits.push('Snow ' + esc(snow));
        if (hail) bits.push('Hail ' + esc(hail) + ' in');
        if (wind) bits.push('Wind ' + esc(wind));
        var label = bits.length ? bits.join(' · ') : esc(r['Please State the Location of this Event.']);

        var pt = [parseFloat(r.Lat), parseFloat(r.Lng)];
        points.push(pt);
        L.marker(pt).addTo(map)
          .bindPopup(html, { maxWidth: 300 })
          .bindTooltip(label, { permanent: true, direction: 'right' });
      });
      if (points.length) map.fitBounds(points, { padding: [50, 50], maxZoom: 10 });
    })
    .catch(function (err) { note.textContent = 'Error: ' + err.message; });
}
</script>
</body>
</html>
