<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weather Reports</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
html,body,#map{height:100%;margin:0}
.pop img{width:100%;margin-top:6px;border-radius:4px}
.pop td{padding:1px 8px 1px 0;vertical-align:top}
.nav{display:flex;gap:4px;margin-bottom:8px}
.nav select{flex:1;min-width:0}
.nav button{cursor:pointer}
.wx-icon{pointer-events:none!important}
.wx{position:relative;width:80px;height:80px}
.wx svg{position:absolute;left:0;top:0;overflow:visible}
.wx-dot{position:absolute;left:27px;top:27px;width:26px;height:26px;box-sizing:border-box;border-radius:50%;border:2px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.5);color:#fff;font:bold 13px/22px sans-serif;text-align:center;cursor:pointer;pointer-events:auto}
.wx-sym{position:absolute;left:50%;top:-14px;transform:translateX(-50%);display:flex;align-items:center;gap:3px;background:#fff;border-radius:12px;padding:1px 6px;box-shadow:0 1px 4px rgba(0,0,0,.4);font-size:15px;line-height:20px;white-space:nowrap;pointer-events:auto;cursor:pointer}
#logos{position:absolute;z-index:1000;top:10px;right:10px;display:flex;gap:8px}
#logos img{height:64px;width:64px;box-shadow:0 1px 5px rgba(0,0,0,.4)}
#logos .proj{border-radius:12px}
#logos .team{border-radius:50%;background:#fff}
#note{position:absolute;z-index:1000;top:10px;left:50px;background:#fff;padding:6px 10px;border-radius:4px;font:14px sans-serif;max-width:60vw}
#key{position:absolute;z-index:1000;bottom:24px;left:10px;background:rgba(255,255,255,.93);padding:6px 10px;border-radius:6px;font:12px sans-serif;max-width:230px}
#key summary{cursor:pointer;font-weight:bold}
#clearbtn{display:none;position:absolute;z-index:1000;bottom:24px;right:10px;background:#dc2626;color:#fff;border:0;border-radius:6px;padding:8px 12px;font:bold 13px sans-serif;cursor:pointer;box-shadow:0 1px 5px rgba(0,0,0,.4)}
#radarbox{position:absolute;z-index:1000;top:84px;left:10px;background:rgba(255,255,255,.95);padding:6px 10px;border-radius:6px;font:13px sans-serif;box-shadow:0 1px 5px rgba(0,0,0,.4)}
#radarbox button{cursor:pointer}
#radarbox .row{margin-top:4px}
</style>
</head>
<body>
<div id="map"></div>
<div id="note">Loading reports...</div>
<div id="radarbox">
  <label><input type="checkbox" id="radarchk"> Radar (whole US)</label>
  <div id="radarctl" style="display:none">
    <div class="row"><button id="radarplay">&#9654; Loop</button> <span id="radartime">Now</span></div>
    <div class="row">Opacity <input type="range" id="radaropac" min="20" max="100" value="70" style="width:90px;vertical-align:middle"></div>
  </div>
  <details class="row">
    <summary style="cursor:pointer">Single radar site</summary>
    <div class="row"><input type="text" id="sitein" placeholder="KIWX" maxlength="4" style="width:60px;text-transform:uppercase"> <button id="sitego">Show</button></div>
    <div class="row"><select id="siteprod">
      <option value="N0B">Reflectivity</option>
      <option value="N0G">Velocity</option>
      <option value="N0S">Storm-relative velocity</option>
      <option value="N0C">Correlation coeff. (CC)</option>
      <option value="N0X">Diff. reflectivity (ZDR)</option>
      <option value="N0K">Specific diff. phase (KDP)</option>
      <option value="N0H">Hydrometeor class.</option>
    </select></div>
    <div class="row"><span id="sitemsg" style="font-size:12px"></span> <button id="siteoff" style="display:none">Off</button></div>
  </details>
</div>
<div
