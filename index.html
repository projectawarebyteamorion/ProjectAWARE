<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Weather Reports</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    html, body, #map { height: 100%; margin: 0; }
    .pop img { width: 100%; margin-top: 6px; border-radius: 4px; }
    .pop td { padding: 1px 8px 1px 0; vertical-align: top; }
        #logos { position: absolute; z-index: 1000; top: 10px; right: 10px; display: flex; gap: 8px; }
    #logos img { height: 64px; width: 64px; box-shadow: 0 1px 5px rgba(0,0,0,0.4); }
    #logos .proj { border-radius: 12px; }
    #logos .team { border-radius: 50%; background: #fff; }
    #note { position: absolute; z-index: 1000; top: 10px; left: 50px; background: #fff;
            padding: 6px 10px; border-radius: 4px; font: 14px sans-serif; }
  </style>
</head>
<body>
<div id="map"></div>
<div id="note">Loading reports...</div>
  <div id="logos">
  <img class="proj" src="project-logo.png" alt="Project AWARE">
  <img class="team" src="team-logo.png" alt="Team Orion">
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
var API = 'https://script.google.com/macros/s/AKfycbzBWh-Y9oTxKlbYC4_p2mNv2arps8jiTcNMpSYPaM3PYvh-Doq5GOznIFn_6Kc3QMO3/exec';

var note = document.getElementById('note');
var map = L.map('map').setView([39.5, -98.35], 4);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© OpenStreetMap contributors'
}).addTo(map);

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

// Finds a value by a keyword in the column header, so small typos in headers don't break it
function pick(r, word) {
  for (var k in r) {
    if (k.toLowerCase().indexOf(word) !== -1) return r[k];
  }
  return '';
}

function row(label, val, always) {
  if (!val && !always) return '';
  return '<tr><td>' + label + '</td><td><b>' + (val ? esc(val) : 'None') + '</b></td></tr>';
}

if (API.indexOf('PASTE_') === 0) {
  note.textContent = 'The web app URL has not been added to this file yet.';
} else {
  fetch(API)
    .then(function (r) { return r.json(); })
    .then(function (reports) {
      note.textContent = reports.length + ' report(s) loaded';
      var points = [];
      reports.forEach(function (r) {
        var type    = pick(r, 'weather report or');
        var date    = pick(r, 'current date');
        var time    = pick(r, 'current time');
        var place   = pick(r, 'location');
        var story   = pick(r, 'situation');
        var temp    = pick(r, 'temperature');
        var humid   = pick(r, 'humidity');
        var press   = pick(r, 'pressure');
        var rain    = pick(r, 'rainfall');
        var snow    = pick(r, 'snowfall');
        var hail    = pick(r, 'hail');
        var wind    = pick(r, 'sustained');
        var gust    = pick(r, 'gust');
        var other   = pick(r, 'other precip');
        var damage  = pick(r, 'damage');

        var html = '<div class="pop"><b>' + esc(type) + '</b>';
        html += '<br>' + esc(date) + ' ' + esc(time);
        html += '<br><i>' + esc(place) + '</i>';
        if (story) html += '<p style="margin:6px 0">' + esc(story) + '</p>';
        html += '<table style="width:100%;border-collapse:collapse;margin-top:6px">';
        html += row('Temperature', temp);
        html += row('Humidity / dew point', humid);
        html += row('Pressure', press);
        html += row('Rainfall', rain ? rain + ' in' : '', true);
        html += row('Snowfall', snow, true);
        html += row('Hail size', hail ? hail + ' in' : '', true);
        html += row('Sustained wind', wind);
        html += row('Wind gusts', gust);
        html += row('Other', other);
        html += '</table>';
        if (damage) html += '<p style="margin:6px 0"><b>Damage:</b> ' + esc(damage) + '</p>';
        String(r.PhotoURLs || '').split(',').filter(Boolean).forEach(function (u) {
          html += '<img src="' + esc(u) + '">';
        });
        html += '</div>';

        var bits = [];
        if (rain) bits.push('Rain ' + esc(rain) + ' in');
        if (snow) bits.push('Snow ' + esc(snow));
        if (hail) bits.push('Hail ' + esc(hail) + ' in');
        if (wind) bits.push('Wind ' + esc(wind));
        if (gust) bits.push('Gusts ' + esc(gust));
        var label = bits.length ? bits.join(' · ') : esc(place);

        var pt = [parseFloat(r.Lat), parseFloat(r.Lng)];
        points.push(pt);
        L.marker(pt).addTo(map)
          .bindPopup(html, { maxWidth: 320 })
          .bindTooltip(label, { permanent: true, direction: 'right' });
      });
      if (points.length) map.fitBounds(points, { padding: [50, 50], maxZoom: 10 });
    })
    .catch(function (err) { note.textContent = 'Error: ' + err.message; });
}
</script>
</body>
</html>
